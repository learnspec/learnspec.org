name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # The player is a separate repository (learnspec/player): a static,
      # client-side player for QuizMD/LearnMD files. It is built here and
      # folded into this site's artifact so it is served from
      # learnspec.org/play/ — one Pages site, one custom domain.
      # `ref` pins what gets published; move it to a tag if main proves noisy.
      - uses: actions/checkout@v4
        with:
          repository: learnspec/player
          ref: main
          path: .player-src

      - name: Build the player
        working-directory: .player-src
        run: |
          npm ci
          npm run build -- --base=/play/

      - name: Fold the player into the site artifact
        run: |
          mkdir -p .vitepress/dist/play
          cp -R .player-src/dist/. .vitepress/dist/play/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
